<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FPS Survival</title>

    <style>
        /* ============================
           ESTILOS GENERALES
           ============================ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            overflow: hidden;
            background: black;
            font-family: 'Arial', sans-serif;
        }

        /* Pantalla de carga mejorada: fondo gris con calavera y texto */
        #loading {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #333333;
            /* gris */
            color: white;
            font-size: 30px;
            z-index: 10;
            pointer-events: all;
        }

        #loading .skull {
            font-size: 80px;
            margin-bottom: 20px;
        }

        /* Vineta roja de daño (aparece cuando la vida es menor al 40%) */
        #damageVignette {
            position: absolute;
            inset: 0;
            background: radial-gradient(ellipse at center, rgba(255, 0, 0, 0) 50%, rgba(255, 0, 0, 0.6) 100%);
            pointer-events: none;
            z-index: 6;
            opacity: 0;
            transition: opacity 0.3s;
        }

        /* Efecto de saturacion en el canvas (vida muy baja) */
        canvas {
            transition: filter 0.5s;
        }

        /* HUD principal (se mueve ligeramente con la camara) */
        #hud {
            position: absolute;
            inset: 0;
            pointer-events: none;
            color: white;
            z-index: 5;
            transition: transform 0.05s linear;
        }

        #topCenter {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
        }

        #timer {
            font-size: 40px;
            font-weight: bold;
            text-shadow: 0 0 15px black;
        }

        /* Radar en esquina superior derecha */
        #radarContainer {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: rgba(0, 0, 0, 0.6);
            border: 2px solid rgba(255, 255, 255, 0.3);
            backdrop-filter: blur(5px);
            overflow: hidden;
            pointer-events: none;
        }

        #radar {
            width: 100%;
            height: 100%;
            position: relative;
        }

        .radar-dot {
            position: absolute;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: red;
            transform: translate(-50%, -50%);
        }

        #radarPlayer {
            position: absolute;
            width: 8px;
            height: 8px;
            background: cyan;
            border-radius: 50%;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        #topLeft {
            position: absolute;
            top: 20px;
            left: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .hudBox {
            background: rgba(0, 0, 0, 0.5);
            border: 2px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(6px);
            padding: 12px 18px;
            border-radius: 14px;
            min-width: 180px;
        }

        .hudTitle {
            font-size: 12px;
            opacity: 0.7;
            margin-bottom: 5px;
            text-transform: uppercase;
        }

        .hudValue {
            font-size: 28px;
            font-weight: bold;
        }

        #bottomLeft {
            position: absolute;
            left: 20px;
            bottom: 20px;
        }

        #healthBar {
            width: 260px;
            height: 26px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            overflow: hidden;
            border: 2px solid rgba(255, 255, 255, 0.15);
        }

        #healthFill {
            width: 100%;
            height: 100%;
            background: linear-gradient(to right, #00ff88, #00cc66);
        }

        #bottomRight {
            position: absolute;
            right: 20px;
            bottom: 20px;
            text-align: right;
        }

        #ammo {
            font-size: 64px;
            font-weight: bold;
            line-height: 1;
        }

        #ammoSmall {
            font-size: 20px;
            opacity: 0.8;
        }

        #waveText {
            color: #00bfff;
        }

        /* Punto de mira */
        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 24px;
            height: 24px;
            transform: translate(-50%, -50%);
        }

        #crosshair::before,
        #crosshair::after {
            content: "";
            position: absolute;
            background: white;
        }

        #crosshair::before {
            width: 2px;
            height: 24px;
            left: 11px;
        }

        #crosshair::after {
            width: 24px;
            height: 2px;
            top: 11px;
        }

        /* Anuncio de oleada */
        #wavePopup {
            position: absolute;
            top: 40%;
            left: 50%;
            transform: translateX(-50%);
            color: white;
            font-size: 60px;
            font-weight: bold;
            opacity: 0;
            transition: 0.5s;
            text-shadow: 0 0 25px black;
        }

        /* Pantalla de muerte */
        #deathScreen {
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(8px);
            z-index: 20;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
            font-family: 'Arial', sans-serif;
            pointer-events: all;
        }

        .death-container {
            background: rgba(20, 20, 20, 0.85);
            border: 2px solid rgba(255, 255, 255, 0.15);
            border-radius: 20px;
            padding: 30px 40px;
            text-align: center;
            backdrop-filter: blur(10px);
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.7);
            max-width: 400px;
            width: 80%;
        }

        .death-skull-placeholder {
            width: 80px;
            height: 80px;
            margin: 0 auto 15px auto;
            display: flex;
            align-items: center;
            justify-content: center;
            color: rgba(255, 255, 255, 0.6);
            font-size: 40px;
        }

        .death-title {
            font-size: 36px;
            font-weight: bold;
            margin-bottom: 25px;
            text-shadow: 0 0 20px rgba(255, 0, 0, 0.8);
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .death-stats {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 15px 20px;
            margin-bottom: 25px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .stat-row {
            display: flex;
            justify-content: space-between;
            font-size: 18px;
            opacity: 0.9;
        }

        .stat-label {
            color: rgba(255, 255, 255, 0.7);
            text-transform: uppercase;
            letter-spacing: 1px;
            font-size: 14px;
        }

        .stat-value {
            font-weight: bold;
            color: white;
        }

        .death-buttons {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-top: 10px;
        }

        .death-button {
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(255, 255, 255, 0.25);
            color: white;
            font-size: 18px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            padding: 12px 30px;
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.3s;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(5px);
        }

        .death-button:hover {
            background: rgba(255, 255, 255, 0.25);
            border-color: rgba(255, 255, 255, 0.5);
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.2);
        }
    </style>
</head>

<body>

    <div id="loading">
        <div class="skull">☠️</div>
        <div>Cargando...</div>
    </div>

    <div id="damageVignette"></div>

    <div id="hud">
        <div id="topCenter"><div id="timer">00:00</div></div>
        <div id="topLeft">
            <div class="hudBox"><div class="hudTitle">Wave</div><div class="hudValue" id="waveText">1</div></div>
            <div class="hudBox"><div class="hudTitle">Kills</div><div class="hudValue" id="killsText">0</div></div>
        </div>
        <div id="radarContainer">
            <div id="radar">
                <div id="radarPlayer"></div>
            </div>
        </div>
        <div id="bottomLeft">
            <div class="hudBox">
                <div class="hudTitle">Health</div>
                <div id="healthBar"><div id="healthFill"></div></div>
                <div style="margin-top:8px;font-size:24px;font-weight:bold;" id="healthText">100</div>
            </div>
        </div>
        <div id="bottomRight">
            <div class="hudBox">
                <div class="hudTitle">Ammo</div>
                <div id="ammo">30</div>
                <div id="ammoSmall">/ 30</div>
            </div>
        </div>
        <div id="crosshair"></div>
        <div id="wavePopup"></div>
    </div>

    <div id="deathScreen">
        <div class="death-container">
            <div class="death-skull-placeholder">☠️</div>
            <div class="death-title">You Died</div>
            <div class="death-stats">
                <div class="stat-row"><span class="stat-label">Wave</span><span class="stat-value" id="deathWave">1</span></div>
                <div class="stat-row"><span class="stat-label">Time</span><span class="stat-value" id="deathTime">00:00</span></div>
                <div class="stat-row"><span class="stat-label">Kills</span><span class="stat-value" id="deathKills">0</span></div>
            </div>
            <div class="death-buttons">
                <button class="death-button" id="restartButton">Restart</button>
                <button class="death-button" id="exitButton">Exit</button>
            </div>
        </div>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.160/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        import { Octree } from 'three/addons/math/Octree.js';
        import { Capsule } from 'three/addons/math/Capsule.js';

        // ================================================================
        // 1. ESCENA, CAMARA Y RENDERER
        // ================================================================
        // Configuracion inicial de Three.js. La escena contiene todo.
        // La camara usa un FOV de 75 y rotacion YXZ para evitar gimbal lock.
        // El renderer tiene antialiasing y sombras activadas.
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, innerWidth / innerHeight, 0.1, 1000);
        camera.rotation.order = 'YXZ';
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(innerWidth, innerHeight);
        renderer.shadowMap.enabled = true;
        document.body.appendChild(renderer.domElement);

        // ================================================================
        // 2. LUCES Y NIEBLA BASE
        // ================================================================
        // Luz hemisferica: simula cielo/suelo.
        // Luz direccional: proyecta sombras.
        // Niebla gris permanente desde el inicio (densidad 0.025).
        const hemi = new THREE.HemisphereLight(0x88ccff, 0x444444, 1.5);
        scene.add(hemi);
        const dirLight = new THREE.DirectionalLight(0xffffff, 2);
        dirLight.position.set(5, 20, 10);
        dirLight.castShadow = true;
        scene.add(dirLight);
        scene.fog = new THREE.Fog(0x666666, 10, 60);
        scene.fog.density = 0.025;

        // ================================================================
        // 3. MUNDO 3D (OCTREE PARA COLISIONES)
        // ================================================================
        // El mundo se carga desde un archivo GLB. Mientras tanto, un suelo
        // de emergencia verde se usa para que el jugador no caiga al vacio.
        // NOTA: Al principio, el mundo tardaba en cargar y el octree estaba
        // vacio, por lo que el jugador caia. Se soluciono agregando este suelo
        // temporal que se agrega al octree apenas arranca el juego.
        const worldOctree = new Octree();
        let worldLoaded = false;
        const emergencyFloor = new THREE.Mesh(
            new THREE.PlaneGeometry(60, 60),
            new THREE.MeshLambertMaterial({ color: 0x44aa44 })
        );
        emergencyFloor.rotation.x = -Math.PI / 2;
        emergencyFloor.position.y = -0.1;
        emergencyFloor.receiveShadow = true;
        scene.add(emergencyFloor);
        const emergencyGroup = new THREE.Group();
        emergencyGroup.add(emergencyFloor);
        worldOctree.fromGraphNode(emergencyGroup);

        const loader = new GLTFLoader();
        loader.load(
            'https://threejs.org/examples/models/gltf/collision-world.glb',
            (gltf) => {
                // Limpiamos el octree y metemos la geometria del mundo real.
                worldOctree.clear();
                scene.add(gltf.scene);
                worldOctree.fromGraphNode(gltf.scene);
                gltf.scene.traverse((child) => {
                    if (child.isMesh) {
                        child.castShadow = true;
                        child.receiveShadow = true;
                    }
                });
                emergencyFloor.visible = false; // ocultamos el suelo temporal
                worldLoaded = true;
                document.getElementById('loading').style.display = 'none';
            },
            undefined,
            (error) => {
                console.warn('Error loading world. Using emergency floor.', error);
                worldLoaded = true;
                document.getElementById('loading').style.display = 'none';
            }
        );

        // ================================================================
        // 4. JUGADOR (FISICAS Y COLISIONES)
        // ================================================================
        // El jugador usa una Capsula para detectar colisiones con el octree.
        // La gravedad se aplica manualmente en updatePlayer.
        // playerOnFloor se determina mediante la normal del impacto.
        const playerCollider = new Capsule(
            new THREE.Vector3(0, 0.35, 0),
            new THREE.Vector3(0, 1, 0),
            0.35
        );
        const playerVelocity = new THREE.Vector3();
        const playerDirection = new THREE.Vector3();
        let playerOnFloor = false;
        const GRAVITY = 30;

        // ================================================================
        // 5. CAMARA SUAVE, ROLL, BOBBING, RETROCESO Y ZOOM
        // ================================================================
        // La camara sigue al jugador con suavidad (positionSmoothFactor).
        // targetYaw/Pitch se actualizan con el raton y se interpolan.
        // Roll: inclinacion lateral al girar, con inercia.
        // Head bobbing: movimiento vertical/lateral al caminar.
        // Zoom: clic derecho reduce FOV a 45.
        // Retroceso: se aplica un offset (recoilOffset) que patea hacia
        // arriba y decae exponencialmente. Antes el error era que el
        // retroceso iba hacia abajo porque se restaba RECOIL_STRENGTH
        // en vez de sumar un offset separado.
        let targetYaw = 0, targetPitch = 0, previousTargetYaw = 0;
        const cameraPositionTarget = new THREE.Vector3();
        const cameraPositionCurrent = new THREE.Vector3();
        const rotationSmoothFactor = 0.12, positionSmoothFactor = 0.2;
        let currentRoll = 0, smoothedAngularVelocity = 0;
        const rollInertia = 0.92, rollStrength = 2.5;
        let bobbingPhase = 0;
        const bobbingSpeed = 8.0, bobbingAmplitudeY = 0.03, bobbingAmplitudeX = 0.015;
        let isZoomed = false;
        const NORMAL_FOV = 75, ZOOM_FOV = 45;
        let mouseSensitivity = 0.002;

        // Retroceso corregido: ahora el arma patea hacia arriba.
        let recoilOffset = 0;
        const RECOIL_STRENGTH = 0.025; // intensidad del pateo
        const RECOIL_DECAY = 10.0;      // velocidad de recuperacion

        cameraPositionTarget.copy(playerCollider.end);
        cameraPositionCurrent.copy(playerCollider.end);
        camera.position.copy(playerCollider.end);

        // ================================================================
        // 6. ESTADO DE MUERTE (DYING/DEAD)
        // ================================================================
        // Cuando la vida llega a 0, se activa "dying". La camara se
        // desvincula del jugador y cae con fisicas durante 3 segundos.
        // Luego aparece la pantalla de "You Died".
        let isDead = false, dying = false, deathTimer = 0;
        const DEATH_DELAY = 3.0;
        const cameraVelocity = new THREE.Vector3();
        const cameraCollider = new THREE.Sphere(new THREE.Vector3(), 0.2);

        // ================================================================
        // 7. ESTADISTICAS DE JUEGO
        // ================================================================
        let health = 100, kills = 0, wave = 1;
        let ammo = 30, reserveAmmo = 30;
        let enemiesToSpawn = 5, enemiesSpawned = 0, enemiesKilledThisWave = 0;
        const wavePopup = document.getElementById('wavePopup');
        const damageVignette = document.getElementById('damageVignette');
        const hudElement = document.getElementById('hud');

        // ================================================================
        // 8. BOTIQUINES DE SALUD (PICKUPS)
        // ================================================================
        // Cada vez que un enemigo muere, tiene una probabilidad de soltar
        // un botiquin representado por un sprite con el emoji ❤️.
        // El sprite se tine de verde (color: 0x00ff88) y pulsa.
        // Al acercarse, recupera 25 de vida (max 100).
        const healthPickups = [];
        const pickupLifetime = 15; // segundos antes de desaparecer
        const pickupRadius = 1.5;
        const healAmount = 25;
        const dropChanceBase = 0.1; // 10% base, aumenta con oleadas

        // Textura del corazon generada en un canvas
        function createHeartTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 64;
            canvas.height = 64;
            const ctx = canvas.getContext('2d');
            ctx.font = '50px Arial';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('❤️', 32, 32);
            return new THREE.CanvasTexture(canvas);
        }
        const heartTexture = createHeartTexture();

        function createHealthPickup(position) {
            const material = new THREE.SpriteMaterial({
                map: heartTexture,
                color: 0x00ff88,      // tinte verde
                depthTest: false,
                depthWrite: false
            });
            const sprite = new THREE.Sprite(material);
            sprite.position.copy(position);
            sprite.scale.set(0.8, 0.8, 0.8);
            scene.add(sprite);
            healthPickups.push({
                sprite,
                age: 0,
                pulsePhase: Math.random() * Math.PI * 2
            });
        }

        // ================================================================
        // 9. ACTUALIZACION DE UI (HUD, VINETA, SATURACION)
        // ================================================================
        function updateUI() {
            document.getElementById('healthText').innerHTML = Math.floor(health);
            document.getElementById('healthFill').style.width = health + '%';
            document.getElementById('killsText').innerHTML = kills;
            document.getElementById('waveText').innerHTML = wave;
            document.getElementById('ammo').innerHTML = ammo;
            document.getElementById('ammoSmall').innerHTML = '/ ' + reserveAmmo;
            // Vineta roja segun vida
            if (health < 40) {
                damageVignette.style.opacity = Math.min(1, (40 - health) / 40) * 0.8;
            } else {
                damageVignette.style.opacity = 0;
            }
            // Saturacion cuando vida < 20
            renderer.domElement.style.filter = `saturate(${health < 20 ? Math.max(0, health / 20) : 1})`;
        }
        updateUI();

        // ================================================================
        // 10. TEMPORIZADOR DE PARTIDA
        // ================================================================
        let gameSeconds = 0;
        setInterval(() => {
            if (!worldLoaded || isDead || dying) return;
            gameSeconds++;
            const mins = String(Math.floor(gameSeconds / 60)).padStart(2, '0');
            const secs = String(gameSeconds % 60).padStart(2, '0');
            document.getElementById('timer').innerHTML = mins + ':' + secs;
        }, 1000);

        // ================================================================
        // 11. PANTALLA DE MUERTE
        // ================================================================
        function showDeathScreen() {
            isDead = true;
            document.getElementById('deathScreen').style.display = 'flex';
            document.getElementById('deathWave').innerText = wave;
            document.getElementById('deathTime').innerText = `${String(Math.floor(gameSeconds / 60)).padStart(2, '0')}:${String(gameSeconds % 60).padStart(2, '0')}`;
            document.getElementById('deathKills').innerText = kills;
            document.exitPointerLock();
        }

        function startDying() {
            if (dying || isDead) return;
            dying = true;
            health = 0;
            updateUI();
            cameraVelocity.copy(playerVelocity).y += 2;
            cameraCollider.center.copy(camera.position);
            cameraPositionTarget.copy(camera.position);
            cameraPositionCurrent.copy(camera.position);
            deathTimer = 0;
            isZoomed = false;
        }

        document.getElementById('restartButton').addEventListener('click', () => location.reload());
        document.getElementById('exitButton').addEventListener('click', () => {
            window.close();
            setTimeout(() => document.body.innerHTML = '<div style="color:white;text-align:center;margin-top:50px;font-size:24px;">You can close this tab now.</div>', 200);
        });

        // ================================================================
        // 12. CONTROLES DE TECLADO Y RATON
        // ================================================================
        const keyStates = {};
        document.addEventListener('keydown', (e) => {
            if (!worldLoaded || isDead || dying) return;
            keyStates[e.code] = true;
            if (e.code === 'KeyR') reload();
        });
        document.addEventListener('keyup', (e) => { keyStates[e.code] = false; });
        document.body.addEventListener('click', () => {
            if (!worldLoaded || isDead || dying) return;
            document.body.requestPointerLock();
        });
        document.addEventListener('contextmenu', e => e.preventDefault());
        document.addEventListener('mousedown', (e) => {
            if (!worldLoaded || isDead || dying) return;
            if (e.button === 0) shoot();
            else if (e.button === 2 && document.pointerLockElement === document.body) isZoomed = true;
        });
        document.addEventListener('mouseup', (e) => { if (e.button === 2) isZoomed = false; });
        document.addEventListener('pointerlockchange', () => {
            if (document.pointerLockElement !== document.body) isZoomed = false;
        });
        document.body.addEventListener('mousemove', (e) => {
            if (!worldLoaded || isDead || dying || document.pointerLockElement !== document.body) return;
            const sens = isZoomed ? mouseSensitivity * 0.5 : mouseSensitivity;
            targetYaw -= e.movementX * sens;
            targetPitch -= e.movementY * sens;
            targetPitch = Math.max(-Math.PI / 2.5, Math.min(Math.PI / 2.5, targetPitch));
        });

        // ================================================================
        // 13. MOVIMIENTO DEL JUGADOR
        // ================================================================
        function getForwardVector() {
            camera.getWorldDirection(playerDirection);
            playerDirection.y = 0;
            playerDirection.normalize();
            return playerDirection;
        }
        function getSideVector() {
            camera.getWorldDirection(playerDirection);
            playerDirection.y = 0;
            playerDirection.normalize();
            playerDirection.cross(camera.up);
            return playerDirection;
        }
        function controls(deltaTime) {
            const speedDelta = deltaTime * (playerOnFloor ? 25 : 8);
            if (keyStates['KeyW']) playerVelocity.add(getForwardVector().multiplyScalar(speedDelta));
            if (keyStates['KeyS']) playerVelocity.add(getForwardVector().multiplyScalar(-speedDelta));
            if (keyStates['KeyA']) playerVelocity.add(getSideVector().multiplyScalar(-speedDelta));
            if (keyStates['KeyD']) playerVelocity.add(getSideVector().multiplyScalar(speedDelta));
            if (playerOnFloor && keyStates['Space']) playerVelocity.y = 15;
        }
        function playerCollisions() {
            const result = worldOctree.capsuleIntersect(playerCollider);
            playerOnFloor = false;
            if (result) {
                playerOnFloor = result.normal.y > 0;
                if (!playerOnFloor) playerVelocity.addScaledVector(result.normal, -result.normal.dot(playerVelocity));
                playerCollider.translate(result.normal.multiplyScalar(result.depth));
            }
        }
        function updatePlayer(deltaTime) {
            if (dying || isDead) return;
            let damping = Math.exp(-4 * deltaTime) - 1;
            if (!playerOnFloor) {
                playerVelocity.y -= GRAVITY * deltaTime;
                damping *= 0.1;
            }
            playerVelocity.addScaledVector(playerVelocity, damping);
            playerCollider.translate(playerVelocity.clone().multiplyScalar(deltaTime));
            playerCollisions();
            cameraPositionTarget.copy(playerCollider.end);
        }

        // ================================================================
        // 14. ENEMIGOS (SPAWN, IA, COLISION CON JUGADOR)
        // ================================================================
        // Tres tipos: normal (rojo, velocidad 4.5), rapido (verde, 6.0),
        // tanque explosivo (azul, 2.5). Todos tienen collider esferico.
        // Al morir, el tanque explota danando al jugador.
        // La colision con el jugador se resuelve empujando al enemigo
        // hacia afuera de la capsula del jugador.
        const enemies = [];
        const normalEnemyMaterial = new THREE.MeshLambertMaterial({ color: 0xff0000 });
        const speedyEnemyMaterial = new THREE.MeshLambertMaterial({ color: 0x00ff00 });
        const tankEnemyMaterial = new THREE.MeshLambertMaterial({ color: 0x0066ff });

        const normalRadius = 0.5, speedyRadius = 0.35, tankRadius = 0.7;
        const normalGeometry = new THREE.SphereGeometry(normalRadius, 16, 16);
        const speedyGeometry = new THREE.SphereGeometry(speedyRadius, 16, 16);
        const tankGeometry = new THREE.SphereGeometry(tankRadius, 16, 16);

        const MAP_BOUNDARY_XZ = 24, MAP_Y_MIN = -10;
        const BASE_MAX_SPEED = 4.5;
        const SPEEDY_MAX_SPEED = 6.0;
        const TANK_MAX_SPEED = 2.5;

        function spawnEnemy() {
            if (!worldLoaded || isDead || dying) return;
            const specialChance = Math.min(0.05 + wave * 0.05, 0.3);
            const isSpeedy = Math.random() < specialChance;
            const isTank = !isSpeedy && Math.random() < 0.2;

            let geometry, material, radius, speed, health;
            if (isSpeedy) {
                geometry = speedyGeometry; material = speedyEnemyMaterial; radius = speedyRadius;
                speed = SPEEDY_MAX_SPEED; health = 200;
            } else if (isTank) {
                geometry = tankGeometry; material = tankEnemyMaterial; radius = tankRadius;
                speed = TANK_MAX_SPEED; health = 300;
            } else {
                geometry = normalGeometry; material = normalEnemyMaterial; radius = normalRadius;
                speed = BASE_MAX_SPEED; health = 100;
            }

            const enemy = new THREE.Mesh(geometry, material);
            enemy.castShadow = true;
            const spawnX = (Math.random() - 0.5) * 40;
            const spawnZ = (Math.random() - 0.5) * 40;
            enemy.position.set(
                Math.max(-MAP_BOUNDARY_XZ + 1, Math.min(MAP_BOUNDARY_XZ - 1, spawnX)),
                3,
                Math.max(-MAP_BOUNDARY_XZ + 1, Math.min(MAP_BOUNDARY_XZ - 1, spawnZ))
            );
            const collider = new THREE.Sphere(enemy.position.clone(), radius);
            scene.add(enemy);
            enemies.push({
                mesh: enemy, velocity: new THREE.Vector3(), collider: collider,
                health: health, maxSpeed: speed, isExplosive: isTank, glowMesh: null
            });
        }

        function capsuleClosestPointToPoint(capsule, point) {
            const start = capsule.start, end = capsule.end;
            const segment = new THREE.Vector3().subVectors(end, start);
            const t = Math.max(0, Math.min(1, new THREE.Vector3().subVectors(point, start).dot(segment) / segment.lengthSq()));
            return new THREE.Vector3().copy(start).addScaledVector(segment, t);
        }

        function updateEnemies(deltaTime) {
            if (!worldLoaded || isDead) return;
            const playerPos = camera.position.clone();
            enemies.forEach((enemy) => {
                if (dying) {
                    enemy.velocity.multiplyScalar(0.9);
                } else {
                    const dir = new THREE.Vector3().subVectors(playerPos, enemy.mesh.position);
                    dir.y = 0; dir.normalize();
                    const desiredVel = dir.clone().multiplyScalar(enemy.maxSpeed);
                    const smoothFactor = 0.15;
                    enemy.velocity.x += (desiredVel.x - enemy.velocity.x) * smoothFactor;
                    enemy.velocity.z += (desiredVel.z - enemy.velocity.z) * smoothFactor;
                }
                enemy.velocity.y -= GRAVITY * deltaTime;

                const deltaMove = enemy.velocity.clone().multiplyScalar(deltaTime);
                enemy.collider.center.add(deltaMove);

                // Colision con el mundo
                const worldResult = worldOctree.sphereIntersect(enemy.collider);
                if (worldResult) {
                    enemy.collider.center.addScaledVector(worldResult.normal, worldResult.depth);
                    if (worldResult.normal.y < 0.5) {
                        enemy.velocity.x = 0; enemy.velocity.z = 0;
                    } else {
                        enemy.velocity.y = 0;
                    }
                }

                // Colision con el jugador (empuje)
                const closestPoint = capsuleClosestPointToPoint(playerCollider, enemy.collider.center);
                const playerToEnemy = new THREE.Vector3().subVectors(enemy.collider.center, closestPoint);
                const dist = playerToEnemy.length();
                const minDist = playerCollider.radius + enemy.collider.radius;
                if (dist < minDist) {
                    const normal = playerToEnemy.normalize();
                    enemy.collider.center.copy(closestPoint.clone().addScaledVector(normal, minDist));
                    const velDot = enemy.velocity.dot(normal);
                    if (velDot < 0) enemy.velocity.addScaledVector(normal, -velDot);
                }

                // Limites del mapa
                const pos = enemy.collider.center;
                if (pos.x > MAP_BOUNDARY_XZ) { pos.x = MAP_BOUNDARY_XZ; enemy.velocity.x = 0; }
                if (pos.x < -MAP_BOUNDARY_XZ) { pos.x = -MAP_BOUNDARY_XZ; enemy.velocity.x = 0; }
                if (pos.z > MAP_BOUNDARY_XZ) { pos.z = MAP_BOUNDARY_XZ; enemy.velocity.z = 0; }
                if (pos.z < -MAP_BOUNDARY_XZ) { pos.z = -MAP_BOUNDARY_XZ; enemy.velocity.z = 0; }
                if (pos.y < MAP_Y_MIN) {
                    pos.set((Math.random() - 0.5) * 30, 3, (Math.random() - 0.5) * 30);
                    enemy.velocity.set(0, 0, 0);
                }
                if (Math.sqrt(pos.x * pos.x + pos.z * pos.z) > 35) {
                    pos.set((Math.random() - 0.5) * 20, 3, (Math.random() - 0.5) * 20);
                    enemy.velocity.set(0, 0, 0);
                }
                enemy.mesh.position.copy(pos);

                // Daño al jugador
                if (!dying && !isDead && enemy.mesh.position.distanceTo(playerPos) < playerCollider.radius + enemy.collider.radius + 0.1) {
                    health -= 0.2;
                    updateUI();
                    if (health <= 0) startDying();
                }
            });

            // Glow para enemigos restantes (cuando quedan <=3)
            if (!dying && enemiesSpawned >= enemiesToSpawn) {
                const shouldGlow = enemies.length <= 3 && enemies.length > 0;
                enemies.forEach(enemy => {
                    if (shouldGlow && !enemy.glowMesh) {
                        const glowGeo = new THREE.SphereGeometry(enemy.collider.radius * 1.2, 16, 16);
                        const glowMat = new THREE.MeshBasicMaterial({ color: 0x00ffff, transparent: true, opacity: 0.4, depthTest: false, depthWrite: false });
                        enemy.glowMesh = new THREE.Mesh(glowGeo, glowMat);
                        enemy.glowMesh.renderOrder = 999;
                        scene.add(enemy.glowMesh);
                    } else if (!shouldGlow && enemy.glowMesh) {
                        scene.remove(enemy.glowMesh);
                        enemy.glowMesh.geometry.dispose();
                        enemy.glowMesh.material.dispose();
                        enemy.glowMesh = null;
                    }
                    if (enemy.glowMesh) enemy.glowMesh.position.copy(enemy.mesh.position);
                });
            }
        }

        // ================================================================
        // 15. OLEADAS
        // ================================================================
        function nextWave() {
            wave++;
            enemiesToSpawn += 5;
            enemiesSpawned = 0;
            enemiesKilledThisWave = 0;
            wavePopup.innerHTML = 'WAVE ' + wave;
            wavePopup.style.opacity = 1;
            setTimeout(() => { wavePopup.style.opacity = 0; }, 2000);
            updateUI();
        }

        setInterval(() => {
            if (!worldLoaded || isDead || dying) return;
            if (enemiesSpawned < enemiesToSpawn) { spawnEnemy(); enemiesSpawned++; }
        }, 1200);

        // ================================================================
        // 16. EXPLOSIONES (ENEMIGO AZUL)
        // ================================================================
        const explosions = [];
        function createExplosion(position) {
            const geometry = new THREE.SphereGeometry(0.7, 16, 16);
            const material = new THREE.MeshBasicMaterial({ color: 0xff6600, transparent: true, opacity: 0.9, depthWrite: false });
            const explosion = new THREE.Mesh(geometry, material);
            explosion.position.copy(position);
            scene.add(explosion);
            explosions.push({ mesh: explosion, age: 0, maxAge: 1.0, radius: 0.7, maxRadius: 5.5 });
            if (!dying && !isDead) {
                const dist = camera.position.distanceTo(position);
                if (dist < 5.5) {
                    health -= Math.max(0, 40 * (1 - dist / 5.5));
                    updateUI();
                    if (health <= 0) startDying();
                }
            }
        }

        // ================================================================
        // 17. BALAS, IMPACTOS Y RETROCESO
        // ================================================================
        const bullets = [];
        const bulletGeometry = new THREE.SphereGeometry(0.08, 8, 8);
        const bulletMaterial = new THREE.MeshBasicMaterial({ color: 0xffff00 });
        const BULLET_SPEED = 70, BULLET_RADIUS = 0.12, STEP_SIZE = 0.2;

        // Textura de impacto (decal)
        let decalTexture;
        (() => {
            const canvas = document.createElement('canvas');
            canvas.width = 64; canvas.height = 64;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#000'; ctx.beginPath(); ctx.arc(32, 32, 28, 0, Math.PI * 2); ctx.fill();
            const gradient = ctx.createRadialGradient(32, 32, 24, 32, 32, 32);
            gradient.addColorStop(0, 'rgba(0,0,0,1)'); gradient.addColorStop(1, 'rgba(0,0,0,0)');
            ctx.fillStyle = gradient; ctx.fillRect(0, 0, 64, 64);
            decalTexture = new THREE.CanvasTexture(canvas);
        })();

        const sparks = [];

        function reload() { ammo = 30; reserveAmmo = 30; updateUI(); }

        function shoot() {
            if (!worldLoaded || isDead || dying || ammo <= 0) return;
            ammo--; updateUI();
            // Retroceso: sumamos un offset que luego decae
            recoilOffset += RECOIL_STRENGTH;
            if (recoilOffset > 0.2) recoilOffset = 0.2; // limite maximo

            const bullet = new THREE.Mesh(bulletGeometry, bulletMaterial);
            camera.getWorldDirection(playerDirection);
            bullet.position.copy(camera.position);
            scene.add(bullet);
            bullets.push({ mesh: bullet, velocity: playerDirection.clone().multiplyScalar(BULLET_SPEED) });
        }

        function createBulletImpact(position, normal, placeDecal = true) {
            if (placeDecal) {
                const dGeo = new THREE.PlaneGeometry(0.4, 0.4);
                const dMat = new THREE.MeshBasicMaterial({ map: decalTexture, transparent: true, depthWrite: false, side: THREE.DoubleSide });
                const decal = new THREE.Mesh(dGeo, dMat);
                decal.position.copy(position).addScaledVector(normal, 0.02);
                decal.lookAt(position.clone().add(normal));
                scene.add(decal);
                setTimeout(() => { scene.remove(decal); dGeo.dispose(); dMat.dispose(); }, 10000);
            }
            const sparkCount = 8;
            const sGeo = new THREE.BoxGeometry(0.03, 0.03, 0.12);
            const sMat = new THREE.MeshBasicMaterial({ color: 0xffaa00 });
            for (let i = 0; i < sparkCount; i++) {
                const spark = new THREE.Mesh(sGeo, sMat);
                spark.position.copy(position);
                const dir = new THREE.Vector3((Math.random() - 0.5) * 2, (Math.random() - 0.5) * 2, (Math.random() - 0.5) * 2).normalize();
                if (dir.dot(normal) < 0.2) dir.reflect(normal).normalize();
                spark.userData = { velocity: dir.clone().multiplyScalar(4 + Math.random() * 5), life: 0.3 + Math.random() * 0.2, age: 0 };
                scene.add(spark);
                sparks.push(spark);
            }
        }

        function updateBullets(deltaTime) {
            if (!worldLoaded || isDead) return;
            for (let i = bullets.length - 1; i >= 0; i--) {
                const bullet = bullets[i];
                const totalDist = BULLET_SPEED * deltaTime;
                const dir = bullet.velocity.clone().normalize();
                const startPos = bullet.mesh.position.clone();
                let remaining = totalDist;
                let hit = false, hitPoint = new THREE.Vector3(), hitNormal = new THREE.Vector3(), hitEnemy = null;

                // Avanzamos la bala en pasos pequenos para no atravesar paredes finas
                while (remaining > 0 && !hit) {
                    const step = Math.min(STEP_SIZE, remaining);
                    const newPos = startPos.clone().addScaledVector(dir, step);
                    const sphere = new THREE.Sphere(newPos, BULLET_RADIUS);
                    const worldResult = worldOctree.sphereIntersect(sphere);
                    if (worldResult) { hit = true; hitPoint.copy(newPos); hitNormal.copy(worldResult.normal); break; }
                    for (const enemy of enemies) {
                        if (enemy.collider.intersectsSphere(sphere)) { hit = true; hitEnemy = enemy; hitPoint.copy(newPos); hitNormal.subVectors(newPos, enemy.mesh.position).normalize(); break; }
                    }
                    startPos.copy(newPos);
                    remaining -= step;
                }

                if (hit) {
                    if (hitEnemy) {
                        hitEnemy.health -= 50;
                        createBulletImpact(hitPoint, hitNormal, false);
                        if (hitEnemy.health <= 0) {
                            // Probabilidad de soltar botiquin
                            const dropChance = Math.min(0.2, dropChanceBase + wave * 0.01);
                            if (Math.random() < dropChance) {
                                createHealthPickup(hitEnemy.mesh.position.clone().add(new THREE.Vector3(0, 0.5, 0)));
                            }
                            if (hitEnemy.isExplosive) createExplosion(hitEnemy.mesh.position);
                            if (hitEnemy.glowMesh) { scene.remove(hitEnemy.glowMesh); hitEnemy.glowMesh.geometry.dispose(); hitEnemy.glowMesh.material.dispose(); }
                            scene.remove(hitEnemy.mesh);
                            enemies.splice(enemies.indexOf(hitEnemy), 1);
                            kills++; enemiesKilledThisWave++;
                            updateUI();
                            if (enemiesKilledThisWave >= enemiesToSpawn) nextWave();
                        }
                    } else {
                        createBulletImpact(hitPoint, hitNormal, true);
                    }
                    scene.remove(bullet.mesh);
                    bullets.splice(i, 1);
                } else {
                    bullet.mesh.position.copy(startPos);
                    if (bullet.mesh.position.distanceTo(camera.position) > 200) { scene.remove(bullet.mesh); bullets.splice(i, 1); }
                }
            }
        }

        function updateSparks(deltaTime) {
            for (let i = sparks.length - 1; i >= 0; i--) {
                const spark = sparks[i];
                spark.userData.age += deltaTime;
                if (spark.userData.age >= spark.userData.life) { scene.remove(spark); spark.geometry.dispose(); spark.material.dispose(); sparks.splice(i, 1); }
                else { spark.position.addScaledVector(spark.userData.velocity, deltaTime); spark.scale.setScalar(1 - spark.userData.age / spark.userData.life); }
            }
        }

        function updateExplosions(deltaTime) {
            for (let i = explosions.length - 1; i >= 0; i--) {
                const exp = explosions[i];
                exp.age += deltaTime;
                if (exp.age >= exp.maxAge) { scene.remove(exp.mesh); exp.mesh.geometry.dispose(); exp.mesh.material.dispose(); explosions.splice(i, 1); }
                else {
                    const scale = exp.radius + (exp.maxRadius - exp.radius) * (exp.age / exp.maxAge);
                    exp.mesh.scale.setScalar(scale);
                    exp.mesh.material.opacity = 0.9 * (1 - exp.age / exp.maxAge);
                }
            }
        }

        function updateHealthPickups(deltaTime) {
            for (let i = healthPickups.length - 1; i >= 0; i--) {
                const pickup = healthPickups[i];
                pickup.age += deltaTime;
                if (pickup.age >= pickupLifetime) {
                    scene.remove(pickup.sprite);
                    healthPickups.splice(i, 1);
                    continue;
                }
                // Animacion de pulso
                const pulse = 1 + Math.sin(pickup.age * 5 + pickup.pulsePhase) * 0.1;
                pickup.sprite.scale.set(0.8 * pulse, 0.8 * pulse, 1);
                // Recoger si el jugador esta cerca
                const dist = pickup.sprite.position.distanceTo(camera.position);
                if (dist < pickupRadius) {
                    health = Math.min(100, health + healAmount);
                    updateUI();
                    scene.remove(pickup.sprite);
                    healthPickups.splice(i, 1);
                }
            }
        }

        // ================================================================
        // 18. CLIMA DINAMICO (DIA/NOCHE + LLUVIA OPCIONAL)
        // ================================================================
        // La niebla gris ya esta fija. Aqui solo cambia el cielo y la luz.
        // La lluvia se activa aleatoriamente y oscurece las luces.
        let currentBase = 'day';
        let baseTransition = 0.0;
        let targetBase = 'day';
        let skyColor = new THREE.Color(0x88ccee);
        let targetSkyColor = new THREE.Color(0x88ccee);
        let hemiIntensity = 1.5, targetHemiIntensity = 1.5;
        let dirIntensity = 2, targetDirIntensity = 2;
        let dirColor = new THREE.Color(0xffffff), targetDirColor = new THREE.Color(0xffffff);

        let rainTransition = 0.0;
        let targetRain = 0.0;
        let rainParticles = null;
        let baseWeatherTimer = 0;
        let rainTimer = 0;
        const BASE_CHANGE_MIN = 30, BASE_CHANGE_MAX = 70;
        const RAIN_CHANGE_MIN = 40, RAIN_CHANGE_MAX = 100;

        function createRainParticles() {
            if (rainParticles) return;
            const count = 800;
            const geo = new THREE.BufferGeometry();
            const pos = new Float32Array(count * 3);
            for (let i = 0; i < count * 3; i += 3) {
                pos[i] = (Math.random() - 0.5) * 80;
                pos[i + 1] = Math.random() * 40;
                pos[i + 2] = (Math.random() - 0.5) * 80;
            }
            geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
            rainParticles = new THREE.Points(geo, new THREE.PointsMaterial({ color: 0xcccccc, size: 0.15, transparent: true, opacity: 0.6, depthWrite: false }));
            scene.add(rainParticles);
        }

        function removeRainParticles() {
            if (rainParticles) { scene.remove(rainParticles); rainParticles.geometry.dispose(); rainParticles.material.dispose(); rainParticles = null; }
        }

        function updateRainParticles(deltaTime) {
            if (!rainParticles) return;
            const pos = rainParticles.geometry.attributes.position.array;
            for (let i = 0; i < pos.length; i += 3) {
                pos[i + 1] -= 15 * deltaTime;
                if (pos[i + 1] < -5) { pos[i + 1] = 35; pos[i] = (Math.random() - 0.5) * 80; pos[i + 2] = (Math.random() - 0.5) * 80; }
            }
            rainParticles.geometry.attributes.position.needsUpdate = true;
        }

        function setBaseTarget(base) {
            targetBase = base;
            if (base === 'day') {
                targetSkyColor.set(0x88ccee); targetHemiIntensity = 1.5; targetDirIntensity = 2; targetDirColor.set(0xffffff);
            } else {
                targetSkyColor.set(0x112233); targetHemiIntensity = 0.5; targetDirIntensity = 0.8; targetDirColor.set(0x88aaff);
            }
            baseTransition = 0.0;
        }

        function updateWeather(deltaTime) {
            baseWeatherTimer += deltaTime;
            const baseChangeInterval = BASE_CHANGE_MIN + Math.random() * (BASE_CHANGE_MAX - BASE_CHANGE_MIN);
            if (baseWeatherTimer >= baseChangeInterval) {
                baseWeatherTimer = 0;
                const newBase = currentBase === 'day' ? 'night' : 'day';
                setBaseTarget(newBase);
            }

            rainTimer += deltaTime;
            const rainChangeInterval = RAIN_CHANGE_MIN + Math.random() * (RAIN_CHANGE_MAX - RAIN_CHANGE_MIN);
            if (rainTimer >= rainChangeInterval) {
                rainTimer = 0;
                targetRain = targetRain === 0 ? 1 : 0;
            }

            if (baseTransition < 1.0) {
                baseTransition = Math.min(1.0, baseTransition + deltaTime * 0.5);
                const t = baseTransition;
                skyColor.lerp(targetSkyColor, t);
                hemiIntensity += (targetHemiIntensity - hemiIntensity) * 0.1;
                dirIntensity += (targetDirIntensity - dirIntensity) * 0.1;
                dirColor.lerp(targetDirColor, t);
                if (baseTransition >= 1.0) currentBase = targetBase;
            }
            scene.background = skyColor;
            hemi.intensity = hemiIntensity;
            dirLight.intensity = dirIntensity;
            dirLight.color.copy(dirColor);

            if (targetRain !== rainTransition) {
                rainTransition += (targetRain - rainTransition) * Math.min(1, deltaTime * 0.8);
                if (Math.abs(rainTransition - targetRain) < 0.01) rainTransition = targetRain;
            }
            if (rainTransition > 0.01 && !rainParticles) createRainParticles();
            if (rainTransition < 0.01 && rainParticles) removeRainParticles();

            const rainDarkFactor = 1 - rainTransition * 0.5;
            hemi.intensity = hemiIntensity * rainDarkFactor;
            dirLight.intensity = dirIntensity * rainDarkFactor;

            if (rainParticles) updateRainParticles(deltaTime);
        }

        setBaseTarget('day');
        currentBase = 'day';
        skyColor.set(0x88ccee);
        baseTransition = 1.0;

        // ================================================================
        // 19. RADAR MINIMAPA
        // ================================================================
        // El radar dibuja puntos rojos para los enemigos dentro de un
        // radio de 30 unidades. El punto cian del centro es el jugador.
        // La orientacion se corrigio para que "arriba" en el radar
        // corresponda a la direccion de la camara.
        const radarDiv = document.getElementById('radar');
        const radarRange = 30;

        function updateRadar() {
            radarDiv.querySelectorAll('.radar-dot').forEach(d => d.remove());
            const forward = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion);
            forward.y = 0; forward.normalize();

            enemies.forEach(enemy => {
                const delta = new THREE.Vector3().subVectors(enemy.mesh.position, camera.position);
                const d2 = new THREE.Vector2(delta.x, delta.z);
                const dist = d2.length();
                if (dist > radarRange) return;

                const angle = Math.atan2(d2.y, d2.x) - Math.atan2(forward.z, forward.x);
                const containerSize = 120;
                const half = containerSize / 2;
                const radarX = half + Math.sin(angle) * (dist / radarRange) * half;
                const radarY = half - Math.cos(angle) * (dist / radarRange) * half;

                const dot = document.createElement('div');
                dot.className = 'radar-dot';
                dot.style.left = radarX + 'px';
                dot.style.top = radarY + 'px';
                radarDiv.appendChild(dot);
            });
        }

        // ================================================================
        // 20. TELETRANSPORTE SI CAE DEL MAPA
        // ================================================================
        function teleportPlayerIfOob() {
            if (camera.position.y <= -25) {
                playerCollider.start.set(0, 0.35, 0); playerCollider.end.set(0, 1, 0);
                playerVelocity.set(0, 0, 0);
                cameraPositionTarget.copy(playerCollider.end);
                cameraPositionCurrent.copy(playerCollider.end);
            }
        }

        // ================================================================
        // 21. REDIMENSIONAR VENTANA
        // ================================================================
        window.addEventListener('resize', () => {
            camera.aspect = innerWidth / innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(innerWidth, innerHeight);
        });

        // ================================================================
        // 22. BUCLE PRINCIPAL
        // ================================================================
        const clock = new THREE.Clock();
        previousTargetYaw = targetYaw;

        function animate() {
            requestAnimationFrame(animate);
            const deltaTime = Math.min(0.05, clock.getDelta());

            if (worldLoaded) {
                updateWeather(deltaTime);

                if (!dying && !isDead) {
                    controls(deltaTime);
                    updatePlayer(deltaTime);
                }

                updateEnemies(deltaTime);
                updateBullets(deltaTime);
                updateSparks(deltaTime);
                updateExplosions(deltaTime);
                updateHealthPickups(deltaTime);

                if (!dying && !isDead) {
                    teleportPlayerIfOob();

                    const rotLerp = 1 - Math.exp(-rotationSmoothFactor * deltaTime * 60);
                    camera.rotation.y += (targetYaw - camera.rotation.y) * rotLerp;
                    camera.rotation.x += (targetPitch - camera.rotation.x) * rotLerp;

                    // Aplicar retroceso como offset adicional
                    camera.rotation.x += recoilOffset;
                    recoilOffset *= Math.exp(-RECOIL_DECAY * deltaTime);
                    if (Math.abs(recoilOffset) < 0.0001) recoilOffset = 0;

                    const deltaYaw = targetYaw - previousTargetYaw;
                    smoothedAngularVelocity += (deltaYaw - smoothedAngularVelocity) * (1 - rollInertia);
                    const targetRoll = THREE.MathUtils.clamp(smoothedAngularVelocity * rollStrength, -0.15, 0.15);
                    const rollLerp = 1 - Math.exp(-0.08 * deltaTime * 60);
                    currentRoll += (targetRoll - currentRoll) * rollLerp;
                    camera.rotation.z = currentRoll;
                    previousTargetYaw = targetYaw;

                    const speed = playerVelocity.length();
                    const isMoving = speed > 0.5 && playerOnFloor;
                    if (isMoving) bobbingPhase += deltaTime * bobbingSpeed * speed;
                    else bobbingPhase += deltaTime * 4.0 * (0 - bobbingPhase);
                    const bobY = Math.sin(bobbingPhase) * bobbingAmplitudeY;
                    const bobX = Math.cos(bobbingPhase * 0.5) * bobbingAmplitudeX;

                    const posLerp = 1 - Math.exp(-positionSmoothFactor * deltaTime * 60);
                    cameraPositionCurrent.lerp(cameraPositionTarget, posLerp);
                    const right = new THREE.Vector3(1, 0, 0).applyQuaternion(camera.quaternion);
                    const up = new THREE.Vector3(0, 1, 0).applyQuaternion(camera.quaternion);
                    camera.position.copy(cameraPositionCurrent).addScaledVector(right, bobX).addScaledVector(up, bobY);

                    const baseFov = NORMAL_FOV + speed * 0.8;
                    const finalFov = isZoomed ? ZOOM_FOV : baseFov;
                    camera.fov += (finalFov - camera.fov) * 0.1;
                    camera.updateProjectionMatrix();

                    hudElement.style.transform = `translate(${bobX * 30}px, ${bobY * 40}px) rotate(${currentRoll * 8}deg)`;
                } else if (dying) {
                    cameraVelocity.y -= GRAVITY * deltaTime;
                    const deltaMove = cameraVelocity.clone().multiplyScalar(deltaTime);
                    cameraCollider.center.copy(camera.position).add(deltaMove);
                    const result = worldOctree.sphereIntersect(cameraCollider);
                    if (result) {
                        cameraCollider.center.addScaledVector(result.normal, result.depth);
                        cameraVelocity.addScaledVector(result.normal, -result.normal.dot(cameraVelocity) * 1.2);
                        cameraVelocity.multiplyScalar(0.5);
                    }
                    camera.position.copy(cameraCollider.center);
                    camera.rotation.x += cameraVelocity.length() * deltaTime * 0.5;
                    camera.rotation.z += cameraVelocity.x * deltaTime * 2;
                    deathTimer += deltaTime;
                    if (deathTimer >= DEATH_DELAY) { dying = false; showDeathScreen(); }
                    camera.fov += (NORMAL_FOV - camera.fov) * 0.1;
                    camera.updateProjectionMatrix();
                    hudElement.style.transform = 'translate(0px, 0px) rotate(0deg)';
                }

                updateRadar();
                updateUI();
            }
            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
