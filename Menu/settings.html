<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>ZOMBIES - NIGHTFALL | CONFIGURACIÓN</title>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="settings.css">
</head>
<body>

    <div class="noise-overlay"></div>
    <div class="vignette"></div>
    <div class="scanline"></div>

    <div class="settings-container">
        <div class="settings-header">
            <h2>⚙ AJUSTES</h2>
            <p>CONFIGURACION</p>
        </div>

        <!-- SLIDERS MUSICA Y EFECTOS -->
        <div class="setting-option">
            <div class="option-label">
                <span>VOLUMEN MUSICA</span>
                <span class="value" id="musicValue">70%</span>
            </div>
            <input type="range" id="musicVolume" min="0" max="100" step="1" value="70">
        </div>

        <div class="setting-option">
            <div class="option-label">
                <span>VOLUMEN EFECTOS</span>
                <span class="value" id="sfxValue">80%</span>
            </div>
            <input type="range" id="sfxVolume" min="0" max="100" step="1" value="80">
        </div>

        <div class="actions">
            <button id="applyBtn" class="settings-btn">APLICAR</button>
            <button id="backBtn" class="settings-btn">VOLVER</button>
            <button id="resetBtn" class="settings-btn">REINICIAR</button>
        </div>
    </div>

    <div class="status-indicator">
        <div class="led red"></div>
        <span>CONFIGURACION </span>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.module.js"
            }
        }
    </script>
    <script type="module" src="settings.js"></script>
</body>
</html>
